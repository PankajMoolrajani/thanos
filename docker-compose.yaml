  #     - ./appsmith-stacks:/appsmith-stacks
  #   restart: unless-stopped
  #   # Default credentials:
  #   # username: admin@example.com
  #   # password: password

volumes:
  neo4j_data:
  neo4j_logs:
  sqlite_data:
