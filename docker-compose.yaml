version: '3.8'
services:

  thanos:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: thanos
    restart: unless-stopped
    volumes:
      - .:/app
    environment:
      - NODE_ENV=development
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USER=neo4j
      - NEO4J_PASSWORD=thanos_password
    ports:
      - "8501:8501"
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - thanos-network
  neo4j:
    image: neo4j:5-community
    container_name: thanos_neo4j
    restart: unless-stopped
    environment:
      - NEO4J_AUTH=neo4j/thanos_password
      - NEO4J_PLUGINS=["apoc"]
      - NEO4J_dbms_security_procedures_unrestricted=apoc.*
      - NEO4J_dbms_security_procedures_allowlist=apoc.*
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs
    healthcheck:
      test: [ "CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:7474 || exit 1" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - thanos-network
  neo4j-mcp:
    image: docker.io/mcp/neo4j-cypher:latest
    container_name: thanos_neo4j_mcp
    restart: unless-stopped
    environment:
      - NEO4J_DATABASE=neo4j
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=thanos_password
      - NEO4J_TRANSPORT=sse
      - NEO4J_MCP_SERVER_ALLOW_ORIGINS=*
      - NEO4J_MCP_SERVER_ALLOWED_HOSTS=*
    ports:
      - "3000:8000" 
    depends_on:
      neo4j:
        condition: service_healthy
    networks:
      - thanos-network

networks:
  thanos-network:
    driver: bridge

volumes:
  neo4j_data:
  neo4j_logs:


